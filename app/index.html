<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上班鼓励</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="./icon.svg" width="47" height="47" alt="">
        <div>
          <h1>上班鼓励</h1>
          <p>WORK CHEER CLUB</p>
        </div>
      </div>
      <button class="settings-button" id="open-settings" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/>
        </svg>
        工资与作息
      </button>
    </header>

    <div class="edition">
      <div class="edition-left">
        <span>打工番剧结算卡</span>
        <div class="mode-switch" role="group" aria-label="选择计算模式">
          <button type="button" data-mode="payroll" aria-pressed="true">计薪模式</button>
          <button type="button" data-mode="debt" aria-pressed="false">还债模式</button>
        </div>
      </div>
      <time id="today"></time>
    </div>

    <section class="earnings" id="earnings" data-status="before" aria-labelledby="earnings-title">
      <div class="earnings-copy">
        <span class="badge" id="status"></span>
        <h2 id="earnings-title">今天已赚</h2>
        <p class="amount"><span id="sign" class="sign" hidden></span><span class="currency">¥</span><span id="earned">0.00</span></p>
        <p class="estimate" id="estimate">按当前工资和作息估算</p>
        <div class="progress-line">
          <label id="progress-label" for="progress">今日工作进度</label>
          <span id="percent">0%</span>
        </div>
        <progress id="progress" max="1" value="0"></progress>
        <p id="debt-detail" class="debt-detail" hidden></p>
      </div>
      <div class="panel-art">
        <div class="art-label"><span>NO. 01</span><span id="art-enemy">打工仓鼠</span></div>
        <img src="./hamster.svg" class="hamster" width="356" height="251" alt="">
        <p id="quote" class="quote"></p>
      </div>
    </section>

    <dl class="stats">
      <div><dt>01 <span>已工作</span></dt><dd id="worked">0 小时 0 分</dd></div>
      <div><dt>02 <span id="daily-label">计划日薪</span></dt><dd id="daily">¥0.00</dd></div>
      <div><dt>03 <span id="hourly-label">参考时薪</span></dt><dd id="hourly">¥0.00</dd></div>
    </dl>

    <footer class="footer">
      <div class="today-plan">
        <label for="override">今日安排</label>
        <select id="override">
          <option value="auto">按作息</option>
          <option value="work">今天上班</option>
          <option value="rest">今天休息</option>
        </select>
      </div>
      <p id="schedule-note"></p>
    </footer>
    <p class="error" id="storage-error" role="alert" hidden></p>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-top">
        <div><p class="dialog-kicker">SETTINGS</p><h2 id="settings-title">收入、开销与作息</h2></div>
        <button type="button" id="close-settings" class="close" aria-label="关闭设置">×</button>
      </div>
      <section>
        <h3 class="section-title">收入</h3>
      <div class="field-grid">
        <label>月工资（元）<input name="salary" type="number" min="0" max="100000000" step="0.01" required></label>
        <label>月计薪天数<input name="payDays" type="number" min="0.01" max="31" step="0.01" required></label>
      </div>
      </section>
      <fieldset>
        <legend>固定工作日</legend>
        <div class="week">
          <label><input name="workDays" type="checkbox" value="1"><span>一</span></label>
          <label><input name="workDays" type="checkbox" value="2"><span>二</span></label>
          <label><input name="workDays" type="checkbox" value="3"><span>三</span></label>
          <label><input name="workDays" type="checkbox" value="4"><span>四</span></label>
          <label><input name="workDays" type="checkbox" value="5"><span>五</span></label>
          <label><input name="workDays" type="checkbox" value="6"><span>六</span></label>
          <label><input name="workDays" type="checkbox" value="0"><span>日</span></label>
        </div>
        <p class="field-note">月计薪天数用于计算日薪，固定工作日决定哪天开始计薪。</p>
      </fieldset>
      <div class="field-grid">
        <label>上班<input name="start" type="time" required></label>
        <label>下班<input name="end" type="time" required></label>
      </div>
      <label class="break-toggle"><input type="checkbox" name="hasBreak">午休期间暂停计薪</label>
      <div class="field-grid" id="break-fields">
        <label>午休开始<input name="breakStart" type="time" required></label>
        <label>午休结束<input name="breakEnd" type="time" required></label>
      </div>
      <section id="debt-fields" class="debt-fields" hidden>
        <h3 class="section-title">每日生活成本</h3>
        <p class="field-note debt-intro">还债模式会先记下当天成本，工作收入实时冲抵；月度金额会按当月天数折算。</p>
        <div class="expense-row">
          <label for="rent">房租</label>
          <div class="expense-inputs">
            <input id="rent" name="rent" type="number" min="0" max="100000000" step="0.01" required>
            <select name="rentPeriod" aria-label="房租填写周期"><option value="monthly">每月</option><option value="daily">每天</option></select>
          </div>
          <small id="rent-daily"></small>
        </div>
        <div class="expense-row">
          <label for="food">伙食费</label>
          <div class="expense-inputs">
            <input id="food" name="food" type="number" min="0" max="100000000" step="0.01" required>
            <select name="foodPeriod" aria-label="伙食费填写周期"><option value="monthly">每月</option><option value="daily">每天</option></select>
          </div>
          <small id="food-daily"></small>
        </div>
        <div class="expense-row">
          <label for="misc">杂七杂八</label>
          <div class="expense-inputs">
            <input id="misc" name="misc" type="number" min="0" max="100000000" step="0.01" required>
            <select name="miscPeriod" aria-label="杂项填写周期"><option value="monthly">每月</option><option value="daily">每天</option></select>
          </div>
          <small id="misc-daily"></small>
        </div>
      </section>
      <p class="error" id="form-error" role="alert" hidden></p>
      <div class="dialog-footer">
        <span>设置仅保存在本机</span>
        <button class="save" type="submit">保存设置</button>
      </div>
    </form>
  </dialog>
</body>
</html>
